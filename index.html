  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: #0a0f1c;
      display: flex;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      color: #d1d5db;
    }

    /* ===== 侧边栏 ===== */
    .sidebar {
      width: 280px;
      background: #111827;
      border-right: 1px solid #1e293b;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: transform 0.25s ease;
      z-index: 30;
    }
    .sidebar-logo {
      padding: 20px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #1e293b;
    }
    .sidebar-logo span {
      font-size: 18px;
      font-weight: 700;
      color: #f1f5f9;
    }
    .sidebar-actions {
      padding: 12px 16px;
      border-bottom: 1px solid #1e293b;
    }
    .sidebar-actions button {
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .sidebar-actions button:hover {
      background: #334155;
      color: white;
    }
    .conversation-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }
    .conversation-item {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 2px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #94a3b8;
      font-size: 14px;
      transition: background 0.15s;
    }
    .conversation-item.active {
      background: #1e293b;
      color: #f1f5f9;
    }
    .conversation-item:not(.active):hover {
      background: #1a2232;
    }
    .conversation-item .title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    .delete-conv {
      opacity: 0;
      transition: opacity 0.2s;
      color: #ef4444;
      margin-left: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    .conversation-item:hover .delete-conv {
      opacity: 1;
    }

    /* ===== 主界面 ===== */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }
    .header {
      background: #111827;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid #1e293b;
      gap: 12px;
    }
    .menu-btn {
      background: none;
      border: none;
      color: #60a5fa;
      font-size: 24px;
      cursor: pointer;
      padding: 0;
      display: none;
    }
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      -webkit-overflow-scrolling: touch;
    }
    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.6;
      word-break: break-word;
      animation: fadeIn 0.2s ease;
      font-size: 15px;
    }
    .user {
      align-self: flex-end;
      background: #2563eb;
      color: white;
      border-bottom-right-radius: 4px;
    }
    .assistant {
      align-self: flex-start;
      background: #1e293b;
      color: #e2e8f0;
      border-bottom-left-radius: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .assistant pre {
      background: #0f172a;
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 13px;
      margin: 8px 0;
      color: #cbd5e1;
      border: 1px solid #334155;
    }
    .assistant code {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 13px;
      color: #93c5fd;
    }
    .input-area {
      background: #111827;
      padding: 14px 16px;
      border-top: 1px solid #1e293b;
      display: flex;
      gap: 10px;
      align-items: center;
      padding-bottom: max(14px, env(safe-area-inset-bottom));
      padding-left: max(16px, env(safe-area-inset-left));
      padding-right: max(16px, env(safe-area-inset-right));
    }
    .input-area input {
      flex: 1;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 15px;
      outline: none;
      background: #0f172a;
      color: #e2e8f0;
      -webkit-appearance: none;
      transition: border-color 0.2s;
    }
    .input-area input:focus {
      border-color: #3b82f6;
    }
    .input-area input::placeholder {
      color: #64748b;
    }
    .input-area button {
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 50%;
      width: 44px; height: 44px;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.2s, transform 0.1s;
    }
    .input-area button:active {
      background: #2563eb;
      transform: scale(0.95);
    }
    .input-area button:disabled {
      opacity: 0.5;
      background: #475569;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .typing-indicator {
      align-self: flex-start;
      background: #1e293b;
      padding: 12px 16px;
      border-radius: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      display: flex; gap: 4px;
    }
    .typing-indicator span {
      width: 8px; height: 8px;
      background: #64748b;
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }
    .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
    .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    .error {
      align-self: flex-start;
      background: #3b1e1e;
      color: #f87171;
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 14px;
    }

    /* 移动端 */
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        left: 0; top: 0; bottom: 0;
        transform: translateX(-100%);
      }
      .sidebar.open {
        transform: translateX(0);
        box-shadow: 4px 0 25px rgba(0,0,0,0.6);
      }
      .menu-btn { display: block; }
    }
  </style>
</head>

  <script>
    // ========== 改成你的 Cloudflare Worker 地址 ==========
    const PROXY_URL = 'mydeepseek.yuyan0526lu.workers.dev';

    const chatContainer = document.getElementById('chatContainer');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const conversationList = document.getElementById('conversationList');
    const newChatBtn = document.getElementById('newChatBtn');
    const menuBtn = document.getElementById('menuBtn');
    const sidebar = document.getElementById('sidebar');

    const STORAGE_KEY = 'deepseek_conversations_v3';
    let conversations = [];
    let currentConvId = null;

    function loadConversations() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try { conversations = JSON.parse(saved); } catch(e) { conversations = []; }
      }
      if (conversations.length === 0) {
        const defaultConv = {
          id: Date.now().toString(),
          title: '新对话',
          messages: [{ role: 'system', content: '你是一个有帮助的助手，使用中文回答。' }]
        };
        conversations.push(defaultConv);
        saveConversations();
      }
      currentConvId = conversations[0].id;
    }

    function saveConversations() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations));
    }

    function getCurrentConv() {
      return conversations.find(c => c.id === currentConvId);
    }

    function renderConversationList() {
      conversationList.innerHTML = '';
      conversations.forEach(conv => {
        const div = document.createElement('div');
        div.className = `conversation-item ${conv.id === currentConvId ? 'active' : ''}`;
        div.innerHTML = `
          <span class="title">${conv.title}</span>
          <span class="delete-conv" data-id="${conv.id}">🗑️</span>
        `;
        div.addEventListener('click', (e) => {
          if (e.target.classList.contains('delete-conv')) return;
          switchConversation(conv.id);
        });
        div.querySelector('.delete-conv').addEventListener('click', (e) => {
          e.stopPropagation();
          deleteConversation(conv.id);
        });
        conversationList.appendChild(div);
      });
    }

    function switchConversation(id) {
      currentConvId = id;
      renderConversationList();
      renderMessages();
      if (window.innerWidth <= 768) sidebar.classList.remove('open');
    }

    function deleteConversation(id) {
      if (conversations.length <= 1) {
        alert('至少保留一个对话');
        return;
      }
      conversations = conversations.filter(c => c.id !== id);
      if (currentConvId === id) currentConvId = conversations[0].id;
      saveConversations();
      renderConversationList();
      renderMessages();
    }

    function newConversation() {
      const newConv = {
        id: Date.now().toString(),
        title: '新对话',
        messages: [{ role: 'system', content: '你是一个有帮助的助手，使用中文回答。' }]
      };
      conversations.unshift(newConv);
      currentConvId = newConv.id;
      saveConversations();
      renderConversationList();
      renderMessages();
      if (window.innerWidth <= 768) sidebar.classList.remove('open');
    }

    function updateTitleIfNeeded() {
      const conv = getCurrentConv();
      if (conv && conv.title === '新对话' && conv.messages.length >= 3) {
        const firstUserMsg = conv.messages.find(m => m.role === 'user');
        if (firstUserMsg) {
          conv.title = firstUserMsg.content.slice(0, 20) + (firstUserMsg.content.length > 20 ? '...' : '');
          saveConversations();
          renderConversationList();
        }
      }
    }

    function renderMessages() {
      chatContainer.innerHTML = '';
      const conv = getCurrentConv();
      if (!conv) return;
      conv.messages.forEach(msg => {
        if (msg.role === 'user' || msg.role === 'assistant') {
          addMessageToDOM(msg.role, msg.content);
        }
      });
    }

    function addMessageToDOM(role, content) {
      const div = document.createElement('div');
      div.className = `message ${role}`;
      if (role === 'assistant') {
        div.innerHTML = simpleMarkdown(content);
      } else {
        div.textContent = content;
      }
      chatContainer.appendChild(div);
      scrollToBottom();
    }

    function simpleMarkdown(text) {
      text = text.replace(/```(\w+)?\n([\s\S]*?)```/g, (match, lang, code) => {
        return `<pre><code>${escapeHtml(code)}</code></pre>`;
      });
      text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
      text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      text = text.replace(/\n/g, '<br>');
      return text;
    }

    function escapeHtml(unsafe) {
      return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function scrollToBottom() {
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    async function streamResponse(userMsg) {
      const conv = getCurrentConv();
      const msgDiv = document.createElement('div');
      msgDiv.className = 'message assistant';
      msgDiv.innerHTML = '';
      chatContainer.appendChild(msgDiv);

      let fullContent = '';
      showTyping();

      try {
        const response = await fetch(PROXY_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: 'deepseek-chat',
            messages: conv.messages,
            stream: true,
          }),
        });

        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();

          for (const line of lines) {
            if (line.startsWith('data: ')) {
              const jsonStr = line.slice(6).trim();
              if (jsonStr === '[DONE]') {
                removeTyping();
                conv.messages.push({ role: 'assistant', content: fullContent });
                saveConversations();
                updateTitleIfNeeded();
                return;
              }
              try {
                const parsed = JSON.parse(jsonStr);
                const delta = parsed.choices?.[0]?.delta?.content;
                if (delta) {
                  fullContent += delta;
                  msgDiv.innerHTML = simpleMarkdown(fullContent);
                  scrollToBottom();
                }
              } catch (e) {}
            }
          }
        }
      } catch (error) {
        removeTyping();
        msgDiv.remove();
        const errDiv = document.createElement('div');
        errDiv.className = 'error';
        errDiv.textContent = '网络请求失败，请检查代理地址或网络连接。';
        chatContainer.appendChild(errDiv);
      }
    }

    function showTyping() {
      const div = document.createElement('div');
      div.className = 'typing-indicator';
      div.id = 'typing';
      div.innerHTML = '<span></span><span></span><span></span>';
      chatContainer.appendChild(div);
      scrollToBottom();
    }

    function removeTyping() {
      const typing = document.getElementById('typing');
      if (typing) typing.remove();
    }

    async function sendMessage() {
      const content = userInput.value.trim();
      if (!content || sendBtn.disabled) return;
      const conv = getCurrentConv();
      if (!conv) return;

      sendBtn.disabled = true;
      addMessageToDOM('user', content);
      conv.messages.push({ role: 'user', content });
      userInput.value = '';
      saveConversations();

      await streamResponse(content);
      sendBtn.disabled = false;
      userInput.focus();
    }

    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });
    newChatBtn.addEventListener('click', newConversation);
    menuBtn.addEventListener('click', () => {
      sidebar.classList.toggle('open');
    });

    document.addEventListener('click', (e) => {
      if (window.innerWidth <= 768 && sidebar.classList.contains('open')) {
        if (!sidebar.contains(e.target) && e.target !== menuBtn) {
          sidebar.classList.remove('open');
        }
      }
    });

    loadConversations();
    renderConversationList();
    renderMessages();
  </script>
